<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER OPS DASHBOARD</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle, #020202, #000000);
  font-family: monospace;
  color: #00ffcc;
  overflow: hidden;
}

/* TOP BAR */
header {
  background: #050505;
  padding: 15px;
  text-align: center;
  border-bottom: 1px solid #00ffcc;
}

header h1 {
  margin: 0;
  color: red;
  letter-spacing: 3px;
}

/* MAIN GRID */
.container {
  display: grid;
  grid-template-columns: 1fr 2fr 1fr;
  height: 90vh;
}

/* PANELS */
.panel {
  border: 1px solid #00ffcc33;
  padding: 10px;
  overflow: hidden;
}

.title {
  color: #ff0033;
  margin-bottom: 10px;
}

/* LOGS */
#logs {
  height: 100%;
  overflow-y: auto;
  font-size: 12px;
}

.line {
  opacity: 0;
  animation: fade 0.4s forwards;
}

@keyframes fade {
  to { opacity: 1; }
}

/* CENTER STATUS */
.center {
  text-align: center;
}

.big {
  font-size: 22px;
  color: #00ffcc;
  margin-top: 20px;
}

.warning {
  color: red;
  font-size: 18px;
  margin-top: 10px;
}

/* PULSE */
.pulse {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 2px solid red;
  margin: 20px auto;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.3); opacity: 0.5; }
  100% { transform: scale(1); opacity: 1; }
}

/* WATERMARK */
.watermark {
  position: absolute;
  bottom: 10px;
  right: 10px;
  color: gray;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <h1>CYBER OPS CONTROL CENTER</h1>
</header>

<div class="container">

  <!-- LEFT PANEL -->
  <div class="panel">
    <div class="title">NETWORK LOGS</div>
    <div id="logs"></div>
  </div>

  <!-- CENTER PANEL -->
  <div class="panel center">
    <div class="title">SYSTEM STATUS</div>

    <div class="pulse"></div>

    <div class="big">SIMULATION ACTIVE</div>
    <div class="warning">NO REAL HACKING OCCURRING</div>

    <p>Target: Mobile Device</p>
    <p>Status: Monitoring Packets</p>
    <p>Firewall: Bypassed (SIM)</p>
  </div>

  <!-- RIGHT PANEL -->
  <div class="panel">
    <div class="title">LIVE METRICS</div>
    <p>CPU LOAD: 87%</p>
    <p>DATA STREAM: ACTIVE</p>
    <p>IP TRACE: RUNNING</p>
    <p>SECURITY LEVEL: LOW (SIM)</p>
    <p>PACKETS: 12,983/s</p>
